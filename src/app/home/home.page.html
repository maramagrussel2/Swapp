<ion-content class="home-content">
  <div class="home-frame">
    <div class="home-wrapper">
      
      <!-- Top Header -->
      <div class="top-bar">
        <div class="user-info">
          <img src="https://i.pravatar.cc/100?img=12" class="avatar" alt="User Profile" />
          <div class="greeting">
            <h2>Hello, Juan! 👋</h2>
            <p>Good morning</p>
          </div>
        </div>
        <button class="icon-btn">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
      </div>

      <!-- Total Balance Card -->
      <div class="balance-card">
        <div class="card-header">
          <span>Total Balance</span>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
        <div class="card-body">
          <h1 class="amount">₱12,345.67</h1>
          <span class="chevron">›</span>
        </div>
      </div>

      <!-- Action Buttons Row -->
      <div class="actions-grid">
        <div class="action-item">
          <div class="action-circle">
            <svg width="20" height="20" fill="none" stroke="#ff5e00" stroke-width="2" viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
          </div>
          <span>Send</span>
        </div>

        <div class="action-item">
          <div class="action-circle">
            <svg width="20" height="20" fill="none" stroke="#ff5e00" stroke-width="2" viewBox="0 0 24 24"><path d="M17 7L7 17M7 17H17M7 17V7"/></svg>
          </div>
          <span>Receive</span>
        </div>

        <div class="action-item">
          <div class="action-circle">
            <svg width="20" height="20" fill="none" stroke="#ff5e00" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <span>Top Up</span>
        </div>

        <div class="action-item">
          <div class="action-circle">
            <svg width="20" height="20" fill="none" stroke="#ff5e00" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <span>History</span>
        </div>
      </div>

      <!-- Recent Transactions Header -->
      <div class="section-header">
        <h3>Recent Transactions</h3>
        <span class="see-all">See all</span>
      </div>

      <!-- Transactions List -->
      <div class="transactions-list">
        
        <div class="tx-item">
          <img src="https://i.pravatar.cc/100?img=5" class="tx-avatar" alt="Maria" />
          <div class="tx-details">
            <span class="tx-name">Maria Santos</span>
            <span class="tx-sub">Received</span>
          </div>
          <div class="tx-amount-group">
            <span class="tx-amount green">+ ₱2,500.00</span>
            <span class="tx-time">Today, 9:41 AM</span>
          </div>
        </div>

        <div class="tx-item">
          <div class="tx-badge starbucks">S</div>
          <div class="tx-details">
            <span class="tx-name">Starbucks</span>
            <span class="tx-sub">Payment</span>
          </div>
          <div class="tx-amount-group">
            <span class="tx-amount red">- ₱250.00</span>
            <span class="tx-time">Today, 8:15 AM</span>
          </div>
        </div>

        <div class="tx-item">
          <div class="tx-badge grab">G</div>
          <div class="tx-details">
            <span class="tx-name">Grab</span>
            <span class="tx-sub">Payment</span>
          </div>
          <div class="tx-amount-group">
            <span class="tx-amount red">- ₱180.00</span>
            <span class="tx-time">Yesterday, 9:23 PM</span>
          </div>
        </div>

      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </div>
      <div class="nav-item">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        <span>Transfer</span>
      </div>
      <div class="nav-item">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM12 8v8M8 12h8"/></svg>
        <span>Convert</span>
      </div>
      <div class="nav-item">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Keypad</span>
      </div>
      <div class="nav-item">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </div>
    </div>

  </div>
</ion-content>
