<ion-content class="login-content">
  <div class="login-frame">
    <div class="login-wrapper">
      
      <!-- Logo Branding Header -->
      <div class="brand-header">
        <div class="logo-badge">
          <span class="logo-symbol">S</span>
        </div>
        <h1 class="main-title">Welcome Back</h1>
        <p class="sub-title">Enter your credentials to access your account</p>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="form-container">
        
        <!-- Email Input -->
        <div class="input-group">
          <label class="input-label">Email Address</label>
          <input 
            type="email" 
            name="email" 
            [(ngModel)]="loginData.email" 
            placeholder="name@example.com" 
            required 
            class="custom-input" />
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <div class="label-row">
            <label class="input-label">Password</label>
            <span class="forgot-link">Forgot?</span>
          </div>
          <input 
            type="password" 
            name="password" 
            [(ngModel)]="loginData.password" 
            placeholder="••••••••" 
            required 
            class="custom-input" />
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="!loginForm.valid" class="btn-orange">
          Log In
        </button>
      </form>

      <!-- Footer Link -->
      <div class="footer-text">
        <p>Don't have an account? <span (click)="goToSignup()" class="link-text">Sign Up</span></p>
      </div>

    </div>
  </div>
</ion-content>
