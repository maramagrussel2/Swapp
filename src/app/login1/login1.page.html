<ion-content [fullscreen]="true" class="login-content">
  <div class="login-page" [class.country-open]="showCountryList">
    <!-- =========================
         HEADER
    ========================== -->

    <div class="login-header">
      <button type="button" class="back-button" (click)="goBack()">
        <span class="back-icon">‹</span>
        <span>Back</span>
      </button>

      <div class="security-icon">🔒</div>
    </div>

    <!-- =========================
         TITLE
    ========================== -->

    <div class="title-section">
      <h1>Welcome Back</h1>

      <p>Enter your mobile number to continue</p>
    </div>

    <!-- =========================
         MOBILE NUMBER
    ========================== -->

    <div class="input-section">
      <label for="mobileNumber"> Mobile Number </label>

      <!-- INPUT BOX -->

      <div class="input-wrapper">
        <!-- COUNTRY SELECTOR -->

        <button
          type="button"
          class="country-selector"
          (click)="toggleCountryList()"
        >
          <span class="country-flag"> {{ selectedCountry.flag }} </span>

          <span class="country-code"> {{ selectedCountry.code }} </span>

          <span class="dropdown-arrow"> ▾ </span>
        </button>

        <!-- MOBILE NUMBER -->

        <input
          id="mobileNumber"
          class="mobile-input"
          type="tel"
          [(ngModel)]="mobileNumber"
          maxlength="15"
          inputmode="numeric"
          placeholder="Mobile number"
        />
      </div>

      <!-- =========================
           COUNTRY DROPDOWN
      ========================== -->

      <div class="country-list" *ngIf="showCountryList">
        <button
          type="button"
          class="country-option"
          *ngFor="let country of countries"
          (click)="selectCountry(country)"
        >
          <span class="option-flag"> {{ country.flag }} </span>

          <span class="option-name"> {{ country.name }} </span>

          <span class="option-code"> {{ country.code }} </span>
        </button>
      </div>

      <!-- INPUT HINT -->

      <span class="input-hint">
        We'll use this number to verify your account
      </span>
    </div>

    <!-- =========================
         CONTINUE CARD
    ========================== -->

    <button type="button" class="main-square" (click)="goToLogin2()">
      <!-- KEYPAD ICON -->

      <div class="keypad-icon">
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- TEXT -->

      <div class="continue-text">
        <span class="continue-title"> Continue </span>

        <span class="continue-subtitle"> Enter your MPIN next </span>
      </div>
    </button>

    <!-- =========================
         FOOTER
    ========================== -->

    <div class="login-footer">
      <button type="button" class="footer-button">
        <span class="footer-icon"> ? </span>

        Help Center
      </button>

      <span class="footer-divider"></span>

      <button type="button" class="footer-button">
        <span class="footer-icon"> ↗ </span>

        Forgot MPIN
      </button>
    </div>
  </div>
</ion-content>
