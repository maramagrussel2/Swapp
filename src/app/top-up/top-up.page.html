<ion-content class="topup-content">
  <div class="topup-page">
    <!-- =========================
         TOP HEADER
         ========================= -->

    <div class="top-header">
      <button type="button" class="back-button" (click)="goBack()">
        <span>←</span>
      </button>

      <h1>Top Up</h1>
    </div>

    <!-- =========================
         MY BALANCE
         ========================= -->

    <div class="balance-section">
      <div class="section-title">My Balance</div>

      <div class="balance-card">
        <span class="balance-amount"> ₱12,345.67 </span>

        <div class="wallet-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              d="M3 7.5A2.5 2.5 0 0 1 5.5 5H19a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5.5A2.5 2.5 0 0 1 3 17.5v-10Z"
            />

            <path d="M3 8h15.5A2.5 2.5 0 0 1 21 10.5v2H17a2 2 0 0 1 0-4h4" />
          </svg>
        </div>
      </div>
    </div>

    <!-- =========================
         TOP UP AMOUNT
         ========================= -->

    <div class="amount-section">
      <div class="section-title">Top Up Amount</div>

      <div class="amount-grid">
        <button
          type="button"
          [class.selected]="selectedAmount === 100"
          (click)="selectAmount(100)"
        >
          ₱100
        </button>

        <button
          type="button"
          [class.selected]="selectedAmount === 200"
          (click)="selectAmount(200)"
        >
          ₱200
        </button>

        <button
          type="button"
          [class.selected]="selectedAmount === 500"
          (click)="selectAmount(500)"
        >
          ₱500
        </button>

        <button
          type="button"
          [class.selected]="selectedAmount === 1000"
          (click)="selectAmount(1000)"
        >
          ₱1,000
        </button>

        <button
          type="button"
          [class.selected]="selectedAmount === 2000"
          (click)="selectAmount(2000)"
        >
          ₱2,000
        </button>

        <button
          type="button"
          [class.selected]="selectedAmount === 5000"
          (click)="selectAmount(5000)"
        >
          ₱5,000
        </button>
      </div>

      <!-- CUSTOM AMOUNT -->

      <div class="custom-amount">
        <input
          type="number"
          [(ngModel)]="customAmount"
          (input)="selectedAmount = 0"
          placeholder="Enter custom amount"
        />

        <span> ₱{{ customAmount || '0.00' }} </span>
      </div>
    </div>

    <!-- =========================
         PAYMENT METHOD
         ========================= -->

    <div class="payment-section">
      <div class="section-title">Payment Method</div>

      <div class="payment-list">
        <!-- BANK TRANSFER -->

        <button
          type="button"
          class="payment-item"
          [class.selected-method]="paymentMethod === 'bank'"
          (click)="goToBankTransfer()"
        >
          <div class="payment-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="M3 9l9-5 9 5" />

              <path d="M5 10v8M9 10v8M15 10v8M19 10v8" />

              <path d="M3 19h18" />
            </svg>
          </div>

          <div class="payment-text">
            <div>Bank Transfer</div>

            <small> Transfer from your bank </small>
          </div>

          <span class="payment-arrow"> › </span>
        </button>

        <!-- DEBIT / CREDIT CARD -->

        <button
          type="button"
          class="payment-item"
          [class.selected-method]="paymentMethod === 'card'"
          (click)="selectPaymentMethod('card')"
        >
          <div class="payment-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />

              <path d="M3 9h18" />

              <path d="M6 14h5" />
            </svg>
          </div>

          <div class="payment-text">
            <div>Debit/Credit Card</div>

            <small> Visa, Mastercard, and more </small>
          </div>

          <span class="payment-arrow"> › </span>
        </button>

        <!-- E-WALLET -->

        <button
          type="button"
          class="payment-item"
          [class.selected-method]="paymentMethod === 'ewallet'"
          (click)="selectPaymentMethod('ewallet')"
        >
          <div class="payment-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path
                d="M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h12"
              />

              <path d="M17 13h4" />

              <circle cx="17" cy="13" r=".7" fill="currentColor" />
            </svg>
          </div>

          <div class="payment-text">
            <div>E-Wallet</div>

            <small> GCash, Maya, and more </small>
          </div>

          <span class="payment-arrow"> › </span>
        </button>

        <!-- CONVENIENCE STORE -->

        <button
          type="button"
          class="payment-item"
          [class.selected-method]="paymentMethod === 'store'"
          (click)="selectPaymentMethod('store')"
        >
          <div class="payment-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="M5 9h14l-1-4H6L5 9Z" />

              <path d="M4 9h16v3H4z" />

              <path d="M6 12v7h12v-7" />

              <path d="M9 19v-4h6v4" />
            </svg>
          </div>

          <div class="payment-text">
            <div>Convenience Store</div>

            <small> Pay at 7-Eleven, Cebuana, and more </small>
          </div>

          <span class="payment-arrow"> › </span>
        </button>
      </div>
    </div>

    <!-- =========================
         CONTINUE
         ========================= -->

    <button
      type="button"
      class="continue-button"
      [disabled]="(!selectedAmount && !customAmount) || !paymentMethod"
      (click)="topUp()"
    >
      Continue
    </button>
  </div>
</ion-content>
